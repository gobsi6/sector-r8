<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SECTOR R-8</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2042%2046%27%3E%3Cpath%20d%3D%27M21%202%20L39%2012.5%20L39%2033.5%20L21%2044%20L3%2033.5%20L3%2012.5%20Z%27%20fill%3D%27%231B1E22%27%20stroke%3D%27%235E9DB4%27%20stroke-width%3D%272.5%27/%3E%3Cpath%20d%3D%27M21%209%20L33%2016%20L33%2030%20L21%2037%20L9%2030%20L9%2016%20Z%27%20fill%3D%27%23E8E8E6%27/%3E%3Ccircle%20cx%3D%2721%27%20cy%3D%2723%27%20r%3D%277%27%20fill%3D%27none%27%20stroke%3D%27%232F6F88%27%20stroke-width%3D%272.5%27/%3E%3Ccircle%20cx%3D%2721%27%20cy%3D%2723%27%20r%3D%272.2%27%20fill%3D%27%23E04848%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ───────── 색과 기본 ───────── */
:root,[data-theme=dark]{
  --bg:linear-gradient(115deg,#0D0D0D 0%,#181818 45%,#132228 100%);--ink:#F2F2F0;--sub:#9A9A98;--faint:rgba(255,255,255,.05);--rule:rgba(255,255,255,.12);
  --tile:#1F1F1F;--tileLine:rgba(255,255,255,.12);--tileHi:#262626;--navy:#24505F;--navyHi:#2F6A7D;--navyLine:#5E9FB3;--onNavy:#EAF3F5;--red:#FF3B30;
  --bar:rgba(10,10,10,.72);--giant:rgba(94,159,179,.07);--stage:radial-gradient(ellipse 60% 55% at 50% 58%,rgba(47,106,125,.45),rgba(47,106,125,0) 70%);
  --selBg:rgba(94,159,179,.14);--shadow:0 18px 40px rgba(0,0,0,.35);
  --sil:#5E5E5C;--silBg:#2A2A2A;--chip:rgba(30,30,30,.86);--line2:rgba(255,255,255,.14);--band:linear-gradient(115deg,rgba(36,80,95,0) 0%,rgba(36,80,95,.4) 50%,rgba(36,80,95,0) 100%);--dots:rgba(94,159,179,.3);
}
[data-theme=light]{
  --bg:linear-gradient(115deg,#EBEBEA 0%,#E2E2E1 42%,#D8DADB 100%);--ink:#1C1C1C;--sub:#5C5C5C;--faint:rgba(0,0,0,.05);--rule:rgba(0,0,0,.14);
  --tile:#F4F4F3;--tileLine:rgba(0,0,0,.12);--tileHi:#F7F7F6;--navy:#1F4A59;--navyHi:#2C6577;--navyLine:#1F4A59;--onNavy:#F4F4F3;--red:#D42A20;
  --bar:rgba(241,241,240,.88);--giant:rgba(31,74,89,.07);--stage:radial-gradient(ellipse 60% 55% at 50% 58%,rgba(31,74,89,.22),rgba(31,74,89,0) 70%);
  --selBg:rgba(31,74,89,.10);--shadow:0 18px 40px rgba(0,0,0,.12);
  --sil:#ABABAA;--silBg:#E6E6E5;--chip:#F7F7F6;--line2:rgba(0,0,0,.14);--band:linear-gradient(115deg,rgba(31,74,89,0) 0%,rgba(31,74,89,.12) 50%,rgba(31,74,89,0) 100%);--dots:rgba(31,74,89,.22);
}
*{box-sizing:border-box;min-width:0}
/* 스크롤바: 얇게, 디자인 색에 맞춰 */
*{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--navyLine)}
::-webkit-scrollbar-corner{background:transparent}
*:hover{scrollbar-color:var(--navyLine) transparent}
html,body{height:100%}
#app{min-height:100%}
body{margin:0;background:var(--bg) fixed;color:var(--ink);font:15px/1.5 'Pretendard Variable',Pretendard,system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--navyLine);outline-offset:2px}
.bb{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.06em;line-height:1}
.sub{color:var(--sub);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ───────── 공통 부품 ───────── */
.pan{background:var(--tile);border-radius:8px;box-shadow:inset 0 0 0 1px var(--tileLine)}
.btn{white-space:nowrap;height:44px;padding:0 18px;border:0;border-radius:6px;background:var(--navy);color:var(--onNavy);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover:not(:disabled){background:var(--navyHi)}
.btn.g{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--tileLine)}
.btn.g:hover:not(:disabled){background:var(--faint)}
.btn.s{height:34px;padding:0 12px;font-size:13px}
.btn.lg{height:52px;font-size:16px}
.ib{width:40px;height:40px;border:0;border-radius:6px;background:transparent;color:var(--ink);display:grid;place-items:center}
.ib:hover{background:var(--faint)}
.ib.f{background:var(--faint)}
.inp{width:100%;height:46px;padding:0 14px;border:0;border-radius:6px;background:var(--faint);box-shadow:inset 0 0 0 1px var(--tileLine);font-size:16px}
textarea.inp{height:120px;padding:12px 14px;line-height:1.6;resize:vertical}
select.inp{appearance:none}
[data-theme=dark] select.inp option{background:#1F1F1F}
.lab{display:flex;flex-direction:column;gap:6px}
.lab .err:empty{display:none}
.lab>span:first-child{font-size:13px;font-weight:700;color:var(--sub)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:8px;background:var(--faint)}
.seg button{height:34px;padding:0 14px;border:0;border-radius:6px;background:transparent;font-size:13px;font-weight:700;color:var(--sub)}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--onNavy)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:11px;font-weight:700;background:var(--navy);color:var(--onNavy);white-space:nowrap}
.tag.o{background:transparent;box-shadow:inset 0 0 0 1px var(--navyLine);color:var(--navyLine)}
.tag.r{background:var(--red);color:#fff}
.note{padding:14px 16px;border-radius:6px;background:var(--faint);display:flex;gap:10px;font-size:13px;line-height:1.6}
.note svg{flex:none;color:var(--navyLine)}
.err{color:var(--red);font-size:13px;font-weight:700;min-height:1em}
.bars{display:flex;gap:2px;height:4px}
.bars i{flex:1;border-radius:1px;background:var(--rule)}
.bars i.on{background:var(--navyLine)}.bars i.half{background:linear-gradient(90deg,var(--navyLine) 50%,var(--rule) 50%)}
.bars.big{gap:3px;height:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub);flex:none}
.dot.on{background:#3CC48A}
.logo{display:flex;align-items:center;gap:10px}
.logobtn[aria-current=page] .bb{color:var(--ink)}.logobtn{border:0;background:transparent;padding:0;color:inherit;font:inherit;cursor:pointer}.logobtn:focus-visible{outline:2px solid var(--navyLine);outline-offset:4px}
.logo .w{font-size:26px;white-space:nowrap}
.logo .w span{color:var(--navyLine)}

/* ───────── 로그인 ───────── */
.login{min-height:100vh;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 520px;position:relative;overflow:hidden}
.login .bandbg,.cr .bandbg{position:absolute;left:-10%;top:0;width:70%;height:100%;background:var(--band);transform:skewX(-18deg);pointer-events:none}
.cr{position:relative;overflow-x:clip;min-height:100vh}
.cr>main,.cr>.mbar{position:relative}
.iw{position:relative;display:flex}
.iw>svg{position:absolute;left:12px;top:14px;color:var(--sub);pointer-events:none}
.iw .inp{padding-left:40px}
.login .giant{position:absolute;left:-30px;bottom:-70px;font-family:'Bebas Neue',sans-serif;font-size:560px;line-height:.8;color:var(--giant);pointer-events:none;white-space:nowrap}
.login .hero{position:relative;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login h1{margin:0;font-size:56px;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.login .lede{margin:0;font-size:16px;line-height:1.7;color:var(--sub);max-width:520px}
.locked{display:flex;align-items:center;gap:8px;font-size:16px;letter-spacing:.2em;color:var(--navyLine)}
.locked i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.tlog{display:flex;flex-direction:column;gap:8px;max-width:460px}
.tlog div{display:flex;gap:12px;font-size:13px;color:var(--sub)}
.tlog b{color:var(--navyLine);font-size:15px}
.login .side{position:relative;padding:48px;display:flex;align-items:center;background:var(--bar);border-left:1px solid var(--rule);backdrop-filter:blur(6px)}
.login form{width:100%;display:flex;flex-direction:column;gap:14px}
.login .ttl{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.login .ttl b{font-size:28px;letter-spacing:-.02em}
.login .or{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub)}
.login .or i{flex:1;height:1px;background:var(--tileLine)}
.demo{padding:12px 14px;border-radius:6px;font-size:13px;line-height:1.6;background:var(--selBg);box-shadow:inset 0 0 0 1px var(--navyLine)}
@media (max-width:999px){
  .login{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .login .giant{font-size:220px;left:auto;right:-20px;top:40px;bottom:auto}
  .login .hero{padding:44px 24px 8px;gap:18px}
  .login h1{font-size:34px}
  .login .tlog{display:none}
  .login .side{padding:20px 24px 32px;background:transparent;border:0;backdrop-filter:none;align-items:flex-start}
}

/* ───────── 재생 절차(캐릭터 생성) ───────── */
.cr{min-height:100vh;display:flex;flex-direction:column}
.cr header{height:72px;padding:0 32px;display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--rule);background:var(--bar);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
.cr .steps{display:flex;gap:4px;margin:0 auto}
.cr .steps button{height:36px;padding:0 12px;border:0;border-radius:6px;background:transparent;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--sub)}
.cr .steps button.done{color:var(--ink)}
.cr .steps button[aria-current=step]{background:var(--navy);color:var(--onNavy);font-weight:800}
.cr .steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:'Bebas Neue',sans-serif;font-size:14px;padding-top:2px;box-shadow:inset 0 0 0 1.5px var(--tileLine)}
.cr .steps .done .n{background:var(--navyLine);color:var(--onNavy);box-shadow:none}
.cr .steps [aria-current=step] .n{background:var(--onNavy);color:var(--navy);box-shadow:none}
.cr .mbar{display:none}
.cr main{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:44px 32px 32px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:48px;align-items:start}
.cr .form{display:flex;flex-direction:column;gap:22px;min-height:620px}
.cr .form h2{margin:4px 0 0;font-size:30px;font-weight:800;letter-spacing:-.02em}
.cr .eyebrow{font-size:18px;letter-spacing:.16em;color:var(--navyLine)}
.cr .body{display:flex;flex-direction:column;gap:20px}
.cr .foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px}
.cr aside{position:sticky;top:104px;display:flex;flex-direction:column;gap:12px}
.bignum{font-size:44px;color:var(--navyLine)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{padding:14px 16px;border:0;border-radius:6px;background:transparent;box-shadow:inset 0 0 0 1px var(--tileLine);text-align:left;display:flex;flex-direction:column;gap:3px}
.choice[aria-pressed=true]{background:var(--selBg);box-shadow:inset 0 0 0 1.5px var(--navyLine)}
.choice b{font-size:15px}
.photo{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.photo .ph{width:168px;height:204px}
.photo .ctl{display:flex;flex-direction:column;gap:8px;flex:1;min-width:200px}
.photo .ctl .row{display:flex;gap:8px;flex-wrap:wrap}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--navyLine);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stepper b{width:64px;text-align:center;font-size:40px}
.statrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 12px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--tileLine)}
.statrow .ctl{display:flex;flex-direction:row;align-items:center;gap:6px}
.statrow .ctl b{width:32px;text-align:center;font-size:24px}
.statrow .ib{width:32px;height:32px;background:var(--faint)}
.derived{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.derived .pan{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.derived b{font-size:28px}
.pcard{padding:12px 14px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--tileLine);display:flex;align-items:center;gap:12px}
.pcard .r{flex:none;width:40px;height:40px;border-radius:6px;display:grid;place-items:center;background:var(--faint);font-size:22px;padding-top:3px}
.pcard .v{flex:1;display:flex;flex-direction:column;gap:3px}
.pcard .v b{font-size:14px;line-height:1.4}
.dice{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.die{width:64px;height:64px;border-radius:10px;display:grid;place-items:center;background:var(--tile);box-shadow:inset 0 0 0 2px var(--ink);font-size:36px;padding-top:4px}
.trait{padding:20px;border-radius:8px;background:linear-gradient(120deg,var(--navy),var(--navyHi));color:var(--onNavy);display:flex;flex-direction:column;gap:10px}
.trait .k{font-size:15px;letter-spacing:.16em;opacity:.8}
.trait b{font-size:26px}
.trait .chips{display:flex;gap:8px;flex-wrap:wrap}
.trait .chips span{height:28px;padding:0 10px;border-radius:4px;display:inline-flex;align-items:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.18)}
.trait .chips span.c{background:var(--red);color:#fff}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.skills .skt{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}.skills .skt>b{display:flex;align-items:baseline;gap:6px}.skills .lv{white-space:nowrap;flex-shrink:0}.skills .tag{flex-shrink:0}
.skills button{min-height:52px;padding:10px 14px;border:0;border-radius:6px;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;box-shadow:inset 0 0 0 1px var(--tileLine)}
.skills button.dept{background:var(--faint);cursor:default}
.skills button[aria-pressed=true]:not(.dept){background:var(--selBg);box-shadow:inset 0 0 0 1.5px var(--navyLine)}
.skills .lv{margin-left:auto;font-size:18px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary .pan{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
@media (max-width:999px){
  .cr header{height:60px;padding:0 16px;gap:12px}
  .cr .steps{display:none}
  .cr .mbar{display:flex;gap:4px;padding:12px 16px 0}
  .cr .mbar i{flex:1;height:4px;border-radius:2px;background:var(--rule)}
  .cr .mbar i.on{background:var(--navyLine)}
  .cr main{grid-template-columns:1fr;padding:20px 16px 24px;gap:24px}
  .cr .form{min-height:0}
  .cr aside{position:static;order:-1}
  .cr aside .badge .stats,.cr aside .badge dl,.cr aside .badge.pv .seal{display:none}
  .photo .ph{width:120px;height:146px}
  .skills{grid-template-columns:1fr}
}

/* ───────── 출입증 ───────── */
.ph{position:relative;flex:none;overflow:hidden;background:var(--silBg);box-shadow:inset 0 0 0 1px var(--tileLine)}
.ph svg,.ph img{position:absolute;inset:0;width:100%;height:100%;display:block}
.ph img{object-fit:cover}
.ph .dots{position:absolute;inset:0;background:radial-gradient(circle,var(--dots) 1.2px,transparent 1.8px) 0 0/7px 7px;opacity:.6;z-index:1;pointer-events:none}
.ph .cn{position:absolute;width:12px;height:12px;z-index:2;pointer-events:none}
.ph .cn.a{left:6px;top:6px;border-left:2px solid var(--navyLine);border-top:2px solid var(--navyLine)}
.ph .cn.b{right:6px;bottom:6px;border-right:2px solid var(--navyLine);border-bottom:2px solid var(--navyLine)}
.badge{display:flex;flex-direction:column;border-radius:6px;overflow:hidden;background:var(--tile);box-shadow:inset 0 0 0 1px var(--line2);filter:drop-shadow(0 18px 30px rgba(0,0,0,.25))}
.badge .bt{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(120deg,var(--navy),var(--navyHi));color:var(--onNavy)}
.badge .bt .t{display:flex;flex-direction:column;gap:2px}
.badge .bt .t .bb{font-size:18px;letter-spacing:.16em}
.badge .bt small{font-size:11px;opacity:.85}
.badge .bt .lv{font-size:13px;letter-spacing:.1em;padding:3px 6px 1px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.badge .id{padding:18px 18px 0;display:flex;gap:16px}
.badge .ph{width:144px;height:180px}
.badge .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.badge .num{font-size:16px;letter-spacing:.1em;color:var(--navyLine)}
.badge .nm{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em;word-break:keep-all}
.badge .kv{margin:auto 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
.badge .kv dt{color:var(--sub)}
.badge .kv dd{margin:0}
.badge .kv dd.n{font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1}
.badge .kv dd.ok{font-weight:700;color:var(--navyLine)}
.badge .stats{padding:16px 18px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.badge .stats>span{display:flex;flex-direction:column;gap:4px}
.badge .stats .l{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.badge .stats .l b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:16px;line-height:1;color:var(--ink)}
.badge .stats .bars{height:5px}
.badge .stats .bars i{border-radius:0}
.badge .info{margin:18px 18px 0;padding-top:14px;border-top:1px solid var(--tileLine);display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 12px;font-size:13px}
.badge .info dt{color:var(--sub)}
.badge .info dd{margin:0;font-weight:600}
.badge .foot{margin:16px 18px 0;padding:12px 0 16px;border-top:1px dashed var(--tileLine);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.badge .barcode{height:30px;display:flex;gap:1px;align-items:stretch}
.badge .barcode i{background:var(--ink)}
.badge .dates{font-size:10px;color:var(--sub);text-align:right;line-height:1.5}
/* 재생 절차 미리보기 출입증 */
.badge.pv .bt{padding:10px 16px}
.badge.pv .bt .bb{font-size:16px;letter-spacing:.16em}
.badge.pv .id{padding:16px;gap:14px}
.badge.pv .ph{width:104px;height:126px}
.badge.pv .who{gap:4px}
.badge.pv .nm{font-size:22px;line-height:1.1}
.badge.pv .stats{padding:0 16px 14px;gap:6px 14px}
.badge.pv .stats .l{font-size:11px}
.badge.pv .stats .l b{font-size:14px}
.badge.pv .stats .bars{height:4px}
.badge.pv .seal{margin:0;padding:12px 16px 16px;border-top:1px dashed var(--tileLine);display:grid;grid-template-columns:64px 1fr;gap:6px 10px;font-size:12px}
.badge.pv .seal dt{color:var(--sub)}
.badge.pv .seal dd{margin:0;font-weight:700;letter-spacing:.05em}
/* 모바일 출입증 */

.center{min-height:0;display:flex;flex-direction:column}
.home{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
.op{grid-column:span 2;position:relative;overflow:hidden;padding:22px 24px;display:flex;flex-direction:column;border-radius:6px;background:linear-gradient(120deg,var(--navy) 0%,var(--navyHi) 100%);color:var(--onNavy)}
.op .ghost{position:absolute;right:-8px;bottom:-40px;font-family:'Bebas Neue',sans-serif;font-size:136px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.2);pointer-events:none}
.op .k{position:relative;display:flex;align-items:center;gap:10px}
.op .k .bb{font-size:18px;letter-spacing:.14em}
.op .pill{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 8px;background:rgba(255,255,255,.14)}
.op .pill i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.5}
.op h2{position:relative;margin:14px 0 0;font-size:26px;line-height:1.2;font-weight:700}
.op p{position:relative;margin:4px 0 0;font-size:13px;opacity:.85}
.op .bot{position:relative;margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.op .teams{display:flex;gap:16px}
.op .teams>span{display:flex;flex-direction:column;gap:6px;font-size:12px;opacity:.85}
.op .teams .sl{display:flex;gap:4px}
.op .teams .sl i{width:28px;height:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.op .teams .sl i.on{background:var(--onNavy);box-shadow:none}
.op .go{white-space:nowrap;flex-shrink:0;height:48px;padding:0 22px 0 18px;border:0;display:flex;align-items:center;gap:10px;background:var(--onNavy);color:var(--navy);font-size:15px;font-weight:800;border-radius:4px}
.op .go:disabled{opacity:.55}
.tile{padding:16px 18px;gap:6px;text-align:left;border:0;font:inherit}
button.tile{cursor:pointer}
button.tile:hover{box-shadow:inset 0 0 0 1px var(--navyLine)}
.tile .sp{flex:1}
.tile .kv{display:flex;align-items:baseline;gap:10px;font-size:12px;color:var(--sub)}
.tile .kv b{font-family:'Bebas Neue',sans-serif;font-size:20px;font-weight:400;color:var(--ink)}
.roster{display:flex;gap:6px;flex-wrap:wrap}
.roster span{width:34px;height:34px;border-radius:2px;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--faint);color:var(--sub);box-shadow:inset 0 0 0 1px var(--tileLine)}
.roster span.on{background:var(--navy);color:var(--onNavy);box-shadow:none}
.logp{grid-column:span 2;padding:16px 18px;gap:10px}
.logp .cnt{margin-left:auto;font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1}
.logp .row{display:flex;align-items:center;gap:10px;font-size:13px}
.logp .row time{flex:none;min-width:46px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.04em;color:var(--navyLine);padding-top:1px}
.logp .row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logp .row small{font-size:12px;color:var(--sub)}
.empty{color:var(--sub);font-size:13px}

/* 요원 */
.roster-p{height:100%;min-height:0}
.roster-p .hd{flex:none;height:52px;padding:0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--tileLine)}
.roster-p .hd .bb{font-size:18px;letter-spacing:.12em}
.roster-p .hd small{font-size:12px;color:var(--sub)}
.roster-p .hd .n{margin-left:auto;font-size:12px;color:var(--sub)}
.ftabs{padding:12px 12px 0;display:flex;gap:4px}
.ftabs button{height:30px;padding:0 12px;border:0;border-radius:2px;background:var(--faint);color:var(--ink);font-size:12px}
.ftabs button[aria-pressed=true]{background:var(--navy);color:var(--onNavy);font-weight:700}
.alist{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.arow{padding:12px;border:0;border-radius:3px;background:transparent;box-shadow:inset 0 0 0 1px var(--tileLine);display:flex;align-items:center;gap:12px;text-align:left;color:var(--ink)}
.arow[aria-pressed=true]{background:var(--selBg);box-shadow:inset 0 0 0 1.5px var(--navyLine)}
.arow .ph{width:40px;height:48px}
.arow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.arow .t .top1{display:flex;align-items:center;gap:6px}
.arow .t b{font-size:15px}
.arow .t small{font-size:11px;color:var(--sub)}
.arow .st{margin-left:auto;font-size:11px;font-weight:700;padding:3px 7px;background:var(--navy);color:var(--onNavy)}
.arow .st.off{background:var(--faint);color:var(--sub)}
.arow .cb{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sub)}
.arow .cb .bars{flex:1;height:4px}
.arow .cb b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:14px;color:var(--ink)}
.detail{height:100%;min-height:0;overflow-y:auto}
.detail .hero{padding:24px;display:flex;gap:24px;border-bottom:1px solid var(--tileLine)}
.detail .hero .ph{width:168px;height:200px}
.detail .hero .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.detail .chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.detail .chips .c1{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.1em;padding:3px 7px 1px;background:var(--navy);color:var(--onNavy)}
.detail .chips .c2{font-size:11px;font-weight:700;padding:3px 7px;background:var(--navyLine);color:var(--onNavy)}
.detail .chips .c2.off{background:var(--faint);color:var(--sub)}
.detail .chips .lv{margin-left:auto;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.1em;padding:3px 7px 1px;box-shadow:inset 0 0 0 1px var(--navyLine);color:var(--navyLine)}
.detail .nm{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.detail .role{font-size:13px;color:var(--sub)}
.detail .cont{margin-top:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--sub)}
.detail .cont .bars{flex:1;height:8px;gap:3px}
.detail .cont .bars i{border-radius:0}
.detail .cont b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:28px;line-height:1;color:var(--ink)}
.detail .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.detail .acts .btn{height:34px;padding:0 12px;font-size:12px;border-radius:2px}
.detail .grid2{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.detail .sec{display:flex;flex-direction:column;gap:12px}
.detail .sec .sh{display:flex;align-items:baseline;gap:8px}
.detail .sec .sh .bb{font-size:16px;letter-spacing:.12em}
.detail .sec .sh small{font-size:12px;color:var(--sub)}
.detail .srow{display:grid;grid-template-columns:44px minmax(0,1fr) 20px;align-items:center;gap:12px;font-size:12px;color:var(--sub)}
.detail .srow .bars{height:7px;gap:3px}
.detail .srow .bars i{border-radius:0}
.detail .srow b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:20px;line-height:1;color:var(--ink);text-align:right}
.detail .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail .cards>span{min-height:62px;padding:12px;border-radius:3px;background:var(--faint);box-shadow:inset 0 0 0 1px var(--tileLine);display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.detail .cards>span small{font-size:11px;font-weight:400;color:var(--navyLine)}
.detail .cards>span.em{font-weight:400;color:var(--sub);background:transparent}
.detail .lower{padding:0 24px 24px;display:flex;flex-direction:column;gap:14px}
.sealbox{border-radius:3px;box-shadow:inset 0 0 0 1px var(--tileLine);overflow:hidden}
.sealbox .hd{padding:12px 14px;display:flex;align-items:center;gap:10px;background:var(--faint)}
.sealbox .hd b,.sealbox .hd .btn{white-space:nowrap;flex:none}
.sealbox .bd{padding:14px;display:grid;grid-template-columns:80px 1fr;gap:8px 12px;font-size:13px;line-height:1.6;margin:0}
.sealbox .bd dt{color:var(--sub)}
.sealbox .bd dd{margin:0}
.wip{height:100%;padding:48px 28px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.wip .bb{font-size:44px;color:var(--navyLine)}
.wip h2{margin:0;font-size:24px}

/* 채팅 */
.chat{height:100%;min-height:0}
.chat .hd{flex:none;height:52px;padding:0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--tileLine)}
.chat .hd>svg{color:var(--navyLine)}
.chat .hd .bb{font-size:18px;letter-spacing:.12em}
.chat .hd small{margin-left:auto;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.chat .hd small i{width:6px;height:6px;border-radius:50%;background:var(--navyLine)}
.chat .tabs{padding:10px 16px 0;display:flex;gap:4px}
.chat .tabs button{height:30px;padding:0 12px;border:0;border-radius:2px;background:var(--faint);font-size:12px;color:var(--ink)}
.chat .tabs button[aria-pressed=true]{background:var(--navy);color:var(--onNavy);font-weight:700}
.chat .list{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:14px}
.chat .list .first{margin-top:auto}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:92%}
.msg .av{flex:none;width:28px;height:28px;border-radius:2px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--navy);color:var(--onNavy)}
.msg .av.c{background:transparent;box-shadow:inset 0 0 0 1.5px var(--navyLine);color:var(--navyLine)}
.msg .m{display:flex;flex-direction:column;gap:4px;min-width:0}
.msg .meta{display:flex;align-items:center;gap:6px;font-size:12px}
.msg .meta .rl{font-size:11px;font-weight:700;padding:1px 6px;background:var(--navy);color:var(--onNavy)}
.msg .meta .rl{flex:none;display:inline-flex;align-items:center;margin:0;overflow:visible;min-height:0;line-height:1.4}
.msg .meta .rl.c{background:transparent;box-shadow:inset 0 0 0 1px var(--navyLine);color:var(--navyLine)}
.msg .meta time{color:var(--sub)}
.msg .tx{font-size:13px;line-height:1.5;padding:8px 12px;background:var(--faint);box-shadow:inset 0 0 0 1px var(--tileLine);word-break:break-word;white-space:pre-wrap}
.msg.me{align-self:flex-end;flex-direction:column;align-items:flex-end;gap:4px;max-width:88%}
.msg.me .tx{background:var(--navy);color:var(--onNavy);box-shadow:none}
.chat form{padding:0 16px 16px;display:flex;gap:8px}
.chat form input{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--tileLine);border-radius:0;background:transparent;font-size:16px}
.chat form input:focus-visible{outline:none;border-color:var(--navyLine)}
.chat form button{width:44px;height:44px;border:0;border-radius:3px;background:var(--navy);color:var(--onNavy);display:grid;place-items:center}
.fab,.sheet-close,.bnav{display:none}

/* ───────── 모바일 셸 ───────── */
@media (max-width:999px){
  .shell{height:auto;min-height:100vh;overflow:visible}
  .shell>.giant{display:none}
  .shell>.bandbg{position:fixed;width:120%;left:-40%;height:50%}
  .pc-only{display:none!important}
  .mb-only{display:flex}
  .top{position:sticky;top:0;height:48px;padding:0 8px 0 16px;gap:8px;backdrop-filter:blur(6px)}
  .top .logo svg,.top .nav,.shell>.top .sep{display:none}
  .top .logo .w{font-size:22px;gap:4px}
  .res{gap:6px}
  .res span{height:26px;padding:0 8px 0 6px;gap:4px;border-radius:2px}
  .res span em{display:none}
  .res svg{width:14px;height:14px}
  .res b{font-size:15px}
  .tools{padding-left:0;border:0;gap:0}
  .tools .ib{width:36px;height:36px}
  .body3{display:flex;flex-direction:column;padding:16px 16px 100px;gap:12px}
  .colR{height:auto}
  .ticker{display:none}
  .home{display:flex;flex-direction:column;gap:8px}
  .op{height:112px;padding:12px 16px;border-radius:5px;flex:none}
  .op .ghost{font-size:86px;right:-6px;bottom:-22px;-webkit-text-stroke:1px rgba(255,255,255,.22)}
  .op .k .bb{font-size:15px}
  .op .k>svg,.op p{display:none}
  .op .pill{font-size:11px;padding:3px 6px}
  .op h2{margin-top:6px;font-size:18px}
  .op .bot{align-items:center}
  .op .teams .sl{display:none}
  .op .teams>span{flex-direction:row;gap:4px}
  .op .go{height:34px;padding:0 14px;font-size:13px;border-radius:3px}
  .tile.base{height:48px;padding:0 14px;flex-direction:row;align-items:center;gap:8px;border-radius:3px;min-height:0}
  .tile.base .hh .bb{font-size:20px}
  .tile.base .hh small,.tile.base .sp{display:none}
  .tile.base .bsub{flex:1;font-size:12px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile.base .kv{white-space:nowrap}
  .tile.base .kv b{font-size:16px}
  .tile.agt{display:none}
  .logp{padding:12px 14px;gap:8px}
  .logp .hh .bb{font-size:22px}
  .roster-p{height:auto}
  .alist{max-height:none}
  .detail{height:auto}
  .detail .hero{padding:16px;gap:14px}
  .detail .hero .ph{width:104px;height:126px}
  .detail .nm{font-size:28px}
  .detail .grid2{grid-template-columns:1fr;padding:16px;gap:20px}
  .detail .lower{padding:0 16px 16px}
  .sealbox .hd .sub{display:none}
  .bnav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 8px calc(16px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid var(--rule);backdrop-filter:blur(8px)}
  .bnav button{height:50px;border:0;border-radius:2px;background:var(--faint);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;white-space:nowrap}
  .bnav button[aria-current=page]{background:var(--navy);color:var(--onNavy)}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border:0;border-radius:6px;background:var(--navy);color:var(--onNavy);box-shadow:0 10px 24px rgba(0,0,0,.3)}
  .fab i{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:2px 5px 0;box-sizing:border-box;background:var(--red);color:#fff;font-style:normal;font-family:'Bebas Neue',sans-serif;font-size:14px;line-height:1;display:grid;place-items:center}
  .colR{position:fixed;inset:0;z-index:40;padding:0;display:none}
  .colR.open{display:block}
  .colR .chat{border-radius:0;height:100%;box-shadow:none}
  .sheet-close{display:grid;margin-left:4px}
}

/* 기지 · 개체 문서 */
.base2,.arch{height:100%;min-height:0}
.base2 .hd,.arch .hd{flex:none;height:52px;padding:0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--tileLine)}
.base2 .hd .bb,.arch .hd .bb{font-size:18px;letter-spacing:.12em}.base2 .hd small,.arch .hd small{font-size:12px;color:var(--sub)}.base2 .hd .n,.arch .hd .n{margin-left:auto;font-size:12px;color:var(--sub)}
.base2 .bd{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:20px}
.sh{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}.sh b{font-size:14px}.sh small{font-size:12px;color:var(--sub)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cell{padding:14px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--tileLine);display:flex;flex-direction:column;gap:8px;min-width:0}
.cell .ch{display:flex;align-items:baseline;gap:8px}.cell .ch .bb{font-size:20px;letter-spacing:.06em;color:var(--navyLine)}.cell .ch b{font-size:14px}.cell .ch small{margin-left:auto;font-size:11px;color:var(--sub)}
.cell .loc{font-size:12px;color:var(--sub)}
.stab{display:flex;align-items:center;gap:10px}.stab .gb{flex:1}.stab .bb{font-size:24px;line-height:1;min-width:52px;text-align:right}
.cell .stt{font-size:12px;font-weight:800;color:var(--navyLine)}
.cell.al{box-shadow:inset 0 0 0 1px var(--red)}.cell.al .gb i{background:var(--red)}.cell.al .stt,.cell.al .stab .bb{color:var(--red)}
.cell.un .ch .bb,.cell.un .stab .bb{color:var(--sub)}.cell.un .stt{color:var(--sub)}
.cell .btn{align-self:flex-start}
.sh b{white-space:nowrap}
.task{padding:16px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--navyLine);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.task .tl{display:flex;flex-direction:column;gap:6px;min-width:0}.task .tl>.bb{font-size:12px;letter-spacing:.08em;color:var(--navyLine)}.task .tl b{font-size:15px}
.task .clock{font-family:var(--mono,monospace);font-size:40px;font-weight:800;letter-spacing:.04em;line-height:1;font-variant-numeric:tabular-nums}
.task .gb{height:6px}.task .sub{font-size:12px}.task.done{box-shadow:inset 0 0 0 1px #C8A040}.task.done .tl>.bb{color:#C8A040}
.ptsnote{font-size:12px;color:var(--navyLine);font-weight:700}.ptsnote b{font-size:14px}
.detail .srow.up{grid-template-columns:44px minmax(0,1fr) 20px 26px}.srow .ib{width:26px;height:26px;border-radius:3px;color:var(--navyLine);box-shadow:inset 0 0 0 1px var(--navyLine)}
.srow .ib:hover:not(:disabled){background:var(--navy);color:var(--onNavy);box-shadow:none}.srow .ib:disabled{color:var(--sub);box-shadow:inset 0 0 0 1px var(--tileLine);opacity:.6}
.rank{display:grid;grid-template-columns:auto 120px auto;align-items:center;gap:8px;font-size:12px}.rank small{color:var(--sub)}.rank .xpb{height:4px;background:var(--faint);position:relative}.rank .xpb i{position:absolute;inset:0 auto 0 0;background:var(--navyLine)}
.gm{min-height:100vh;display:flex;flex-direction:column}
.gm .top{display:flex;align-items:center;gap:16px;padding:0 24px;height:72px;border-bottom:1px solid var(--tileLine)}
.gm .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.gmtabs{display:flex;gap:4px}.gmtabs button,.gmoptabs button{height:34px;padding:0 14px;border:0;border-radius:2px;background:var(--faint);color:var(--ink);font-size:13px}
.gmtabs button[aria-pressed=true],.gmoptabs button[aria-pressed=true]{background:var(--navy);color:var(--onNavy);font-weight:700}
.gmbody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;padding:24px;min-height:0}
.gmside .chat{height:calc(100vh - 120px)}
.gmmain .pnl{padding:20px;display:flex;flex-direction:column;gap:14px}
.gmsplit{display:grid!important;grid-template-columns:280px minmax(0,1fr)}.gmcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.gmlist{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 220px);overflow:auto}
.gmrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:0;border-radius:4px;background:transparent;box-shadow:inset 0 0 0 1px var(--tileLine);text-align:left;color:var(--ink)}
.gmrow.on{box-shadow:inset 0 0 0 1.5px var(--navyLine);background:var(--selBg)}.gmrow .sub{font-size:11px}.gmrow .st{font-size:11px;color:var(--navyLine)}.gmrow .st.w{color:#C8A040}
.gmform{display:flex;flex-direction:column;gap:10px}.gmform h3{margin:0;font-size:18px}
.gmform textarea,.gmform input:not([type=checkbox]),.gmform select,.gact select{background:var(--faint);border:0;border-radius:3px;padding:8px 10px;color:var(--ink);font:inherit;font-size:13px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.gf{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--sub)}.gf input{background:var(--faint);border:0;border-radius:3px;padding:7px 8px;color:var(--ink);font:inherit;font-size:14px;width:100%}
.gf.in{flex-direction:row;align-items:center;gap:6px}.gf.in input{width:72px}
.gchk{font-size:12px;display:flex;align-items:center;gap:6px}
.gact{display:flex;align-items:center;gap:8px}.gact.wrap{flex-wrap:wrap}
.gmmsg{margin:0;font-size:12px;color:var(--navyLine);font-weight:700}
.gmoptabs{display:flex;gap:4px;flex-wrap:wrap}.gmoptabs small{opacity:.7;font-size:11px}

/* 연출: 가까이 있으면 노이즈가 불안하게 출렁이고, 접촉하면 무대가 크게 흔들린다 */
.cctv .tear{position:absolute;left:0;right:0;opacity:0;pointer-events:none;z-index:1}
.cctv .tear.t1{top:22%;height:7%;background:repeating-linear-gradient(90deg,rgba(220,235,232,.35) 0 3px,transparent 3px 9px);mix-blend-mode:screen}

@keyframes stgShake{0%,100%{transform:none}6%{transform:translate(-14px,6px) rotate(-.6deg)}12%{transform:translate(12px,-8px) rotate(.5deg)}18%{transform:translate(-9px,4px)}24%{transform:translate(7px,-3px)}30%{transform:translate(-4px,2px)}36%{transform:translate(2px,-1px)}44%{transform:none}}

@keyframes tearCx{0%{opacity:1;transform:translateX(-30px)}10%{opacity:1;transform:translateX(24px)}22%{opacity:.8;transform:translateX(-12px)}36%,100%{opacity:0}}
@keyframes flashCx{0%{opacity:.75}18%{opacity:.25}45%,100%{opacity:0}}
@keyframes ctxIn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}10%{opacity:1;transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes ctxRgb{0%,30%,100%{text-shadow:0 0 18px rgba(229,87,79,.9),2px 0 #E5574F,-2px 0 #5E9FB3}8%{text-shadow:0 0 18px rgba(229,87,79,.9),10px 0 #E5574F,-10px 0 #5E9FB3}}
@keyframes nzUneasy{0%,100%{opacity:.5}45%{opacity:.62}50%{opacity:.85}52%{opacity:.55}80%{opacity:.7}}
@keyframes jit{0%,48%,51%,86%,88%,100%{transform:none}49%{transform:translate(3px,-1px)}50%{transform:translate(-4px,1px)}87%{transform:translate(-2px,0)}}
@keyframes tearNear{0%,47%,53%,100%{opacity:0}49%{opacity:.9;transform:translateX(-14px)}51%{opacity:.7;transform:translateX(10px)}}
.stg.fx-contact .cctv{animation:stgShake 1.4s cubic-bezier(.2,.7,.3,1) 1}
.stg.fx-contact .cctv .nz::before{animation:camGrain .5s steps(5) infinite,nzBurst 1.4s ease-out 1 forwards}
.stg.fx-contact .cctv::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 55% 45%,rgba(229,87,79,.3),rgba(120,10,10,.5) 75%);mix-blend-mode:multiply;pointer-events:none;z-index:1}
.stg.fx-contact .tear{animation:tearCx 1.2s steps(6) 1}.stg.fx-contact .tear.t2{animation-delay:.08s}.stg.fx-contact .tear.t3{animation-delay:.04s}

    watchOps(cb) { subs.ops.add(cb); connect().catch(() => {}); if (ops.size) cb(Object.fromEntries(ops)); return () => subs.ops.delete(cb); },

    watchDm(cb) { subs.dm.add(cb); connect().catch(() => {}); cb(dmState, null); return () => subs.dm.delete(cb); },
    watchNotice(cb) { subs.notice.add(cb); return () => subs.notice.delete(cb); },

    case 'gmMakeAgent': B.getDraft().then(d => { S.c = freshCreate(d); S.phase = 'create'; render(); }).catch(err => { S.gmMsg = errMsg(err); gmRender(); }); return;
    case 'toLobby': S.phase = 'lobby'; S.chan = 'all'; S.dmWith = null; S.view = 'home'; return render();
    case 'gmTab': S.gmTab = v; S.gmMsg = ''; gmRender(); return requestAnimationFrame(() => drawPanels([...app.querySelectorAll('#gmMain > .pnl')]));
    case 'gmSel': S.gmSel = v; S.gmMsg = ''; return gmRender();
    case 'gmOpSel': S.gmOp = v; return refreshGM(true);
    case 'gmOp': { const r = gmCurOp(); if (!r) return; const b = { op: r.op.id, act: v };
      if (v === 'dist') b.v = +(app.querySelector('[data-gm=dist]') || {}).value;
      if (v === 'count+' || v === 'count-') { b.act = 'count'; b.v = v === 'count+' ? 1 : -1; }
      if (v === 'spawnF' || v === 'spawnR') { b.act = 'spawn'; b.side = v === 'spawnF' ? 'front' : 'rear'; }
      if (v === 'restore') b.uid = t.dataset.t;
      if (v === 'success' || v === 'fail' || v === 'abort') { if (!confirm(`작전을 ${v === 'success' ? '성공' : v === 'fail' ? '실패' : '중단'}으로 끝낼까요?`)) return; b.act = 'end'; b.result = v; }
      B.gmOp(b).then(() => { S.gmMsg = ''; }).catch(err => { S.gmMsg = errMsg(err); refreshGM(true); }); return; }
    case 'gmEnt': { const row = t.closest('[data-ent]'), id = row.dataset.ent, q = k => row.querySelector(`[data-k=${k}]`);
      const b = { id, stability: +q('stab').value, captured: q('cap').checked, obs: +q('obs').value }; if (t.dataset.v === 'unlock') b.unlock = true;
      B.gmEntity(b).then(() => { S.gmMsg = id + ' 저장했습니다.'; gmRender(); }).catch(err => { S.gmMsg = errMsg(err); gmRender(); }); return; }
    case 'chat': S.chatOpen = !S.chatOpen; S.unread = 0; app.querySelector('.shell')?.classList.toggle('chatopen', S.chatOpen); document.getElementById('colR').classList.toggle('open', S.chatOpen); refreshFab(); if (S.chatOpen) { scrollChat(); document.getElementById('chatIn')?.focus(); } return;
  }
});
// 주사위 굴림 연출: 숫자가 잠깐 돌다가 결과에 멈춘다
const calm = () => matchMedia('(prefers-reduced-motion:reduce)').matches;
let rollBusy = false;
function roll(sel, commit, landed) {
  if (rollBusy) return;
  const c = S.c, els = [...app.querySelectorAll(sel)];
  const finish = () => { commit(); c.landed = landed; render(); c.landed = null; rollBusy = false; };
  if (calm() || !els.length) return finish();
  rollBusy = true;
  app.querySelectorAll('[data-act^="pick"]').forEach(b => b.disabled = true);
  els.forEach(el => el.classList.add('rolling'));
  const faces = el => d(+el.dataset.roll);
  const t = setInterval(() => els.forEach(el => { el.textContent = faces(el); }), 55);
  setTimeout(() => { clearInterval(t); finish(); }, 620);
}
// 철수는 두 번 눌러야 실행된다 (실수 방지)
function confirmAbort(btn) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.innerHTML = ico('x', 14, 2) + '한 번 더 누르면 철수합니다';
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.innerHTML = ico('x', 14, 2) + '철수'; } }, 3000);
  return false;
}
function rollStats() { let s; do { s = SN.map(() => d(6) + 1); } while (s.reduce((a, b) => a + b, 0) < 20); S.c.stats = s; }
function fixFree(c) { return c.free >= 0 && DEPT[c.dept][1].includes(SKILLS[c.free][0]) ? -1 : c.free; }

// 사진 자르기: 출입증 비율(112:136)의 틀 안에서 끌어서 위치를, 막대로 크기를 맞춘 뒤 224×272로 저장한다
const CW = 280, CH = 340;
function openCrop(file) {
  if (!file || !/^image\//.test(file.type)) return Promise.reject({ code: 'photo/type' });
  if (file.size > 20 * 1024 * 1024) return Promise.reject({ code: 'photo/big' });
  const url = URL.createObjectURL(file);
  return new Promise((done, fail) => {
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); fail({ code: 'photo/type' }); };
    img.onload = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight, min = Math.max(CW / iw, CH / ih);
      let sc = min, x = (CW - iw * sc) / 2, y = (CH - ih * sc) / 2;
      const back = document.activeElement;
      const ov = document.createElement('div'); ov.className = 'crop';
      ov.innerHTML = `<div class="cropbox" role="dialog" aria-modal="true" aria-labelledby="cropT">
        <span class="bb" style="font-size:16px;letter-spacing:.16em;color:var(--navyLine)">PHOTO</span><b id="cropT" style="font-size:20px">사진 자르기</b>
        <span class="sub">사진을 끌어서 위치를 맞추고, 아래 막대로 크기를 조절하십시오.</span>
        <div class="cv"><canvas width="${CW * 2}" height="${CH * 2}" style="width:${CW}px;height:${CH}px" aria-label="자를 영역, 화살표 키로 이동"  tabindex="0"></canvas><i class="cn a"></i><i class="cn b"></i></div>
        <label class="zoom">${ico('minus', 14, 2)}<input type="range" min="0" max="100" value="0" aria-label="확대">${ico('plus', 14, 2)}</label>
        <span class="row"><button class="btn g" data-c="cancel">취소</button><button class="btn" data-c="ok">${ico('check', 16, 2.5)}적용</button></span></div>`;
      document.body.appendChild(ov);
      const cv = ov.querySelector('canvas'), g = cv.getContext('2d'), rg = ov.querySelector('input');
      const clamp = () => { x = Math.min(0, Math.max(CW - iw * sc, x)); y = Math.min(0, Math.max(CH - ih * sc, y)); };
      const draw = () => { clamp(); g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, CW, CH); g.drawImage(img, x, y, iw * sc, ih * sc); };
      const zoomTo = (ns, cx = CW / 2, cy = CH / 2) => { ns = Math.max(min, Math.min(min * 4, ns)); x = cx - (cx - x) * ns / sc; y = cy - (cy - y) * ns / sc; sc = ns; rg.value = Math.round((sc / min - 1) / 3 * 100); draw(); };
      draw();
      let drag = null;
      cv.addEventListener('pointerdown', e => { drag = { px: e.clientX, py: e.clientY, x, y }; cv.setPointerCapture(e.pointerId); });
      cv.addEventListener('pointermove', e => { if (!drag) return; x = drag.x + e.clientX - drag.px; y = drag.y + e.clientY - drag.py; draw(); });
      cv.addEventListener('pointerup', () => { drag = null; });
      cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomTo(sc * (e.deltaY < 0 ? 1.08 : 1 / 1.08), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
      cv.addEventListener('keydown', e => { const m = { ArrowLeft: [8, 0], ArrowRight: [-8, 0], ArrowUp: [0, 8], ArrowDown: [0, -8] }[e.key]; if (m) { e.preventDefault(); x += m[0]; y += m[1]; draw(); } });
      rg.addEventListener('input', () => zoomTo(min * (1 + 3 * rg.value / 100)));
      const close = () => { ov.remove(); URL.revokeObjectURL(url); document.removeEventListener('keydown', onKey); back && back.focus && back.focus(); };
      const onKey = e => { if (e.key === 'Escape') { close(); fail({ code: 'photo/cancel' }); } };
      document.addEventListener('keydown', onKey);
      ov.addEventListener('click', e => {
        const b = e.target.closest('[data-c]'); if (!b && e.target !== ov) return;
        if (!b || b.dataset.c === 'cancel') { close(); return fail({ code: 'photo/cancel' }); }
        const out = document.createElement('canvas'); out.width = 224; out.height = 272;
        const k = 224 / CW; out.getContext('2d').drawImage(img, x * k, y * k, iw * sc * k, ih * sc * k);
        let data = null;
        for (const q of [0.86, 0.75, 0.6]) { let o = out.toDataURL('image/webp', q); if (!o.startsWith('data:image/webp')) o = out.toDataURL('image/jpeg', q); if (o.length < 180000) { data = o; break; } }
        close(); data ? done(data) : fail({ code: 'photo/big' });
      });
      ov.querySelector('[data-c=ok]').focus();
    };
    img.src = url;
  });
}
app.addEventListener('change', async e => {
  const inp = e.target; if (!inp.dataset || inp.dataset.file !== 'photo') return;
  const file = inp.files && inp.files[0]; inp.value = ''; if (!file) return;
  try {
    const data = await openCrop(file);
    if (S.phase === 'create') { S.c.photo = data; S.c.photoErr = ''; render(); }
    else { S.photoErr = ''; S.photoMenu = false; await B.setPhoto(data); }
  } catch (err) {
    if (err && err.code === 'photo/cancel') return;
    if (S.phase === 'create') { S.c.photoErr = errMsg(err); render(); } else { S.photoErr = errMsg(err); renderCenter(); }
  }
});

app.addEventListener('input', e => {
  const k = e.target.dataset.in; if (!k || !S.c) return;
  const c = S.c;
  if (k === 'dept') { c.dept = +e.target.value; c.free = fixFree(c); return render(); }
  c[k] = e.target.value;
  if (k === 'name') {
    const b = app.querySelector('[data-bind=name]'); if (b) b.textContent = c.name || '호출명 미정';
    const n = app.querySelector('[data-need="0"]'), w = app.querySelector('[data-bind=why]');
    if (n) n.disabled = !c.name.trim(); if (w) w.textContent = c.name.trim() ? '' : '호출명을 입력하십시오.';
  }
  if (k === 'realName') { const ok = !!c.realName.trim() && c.pastPick >= 0, n = app.querySelector('[data-need="2"]'), w = app.querySelector('[data-bind=why]'); if (n) n.disabled = !ok; if (w) w.textContent = ok ? '' : !c.realName.trim() ? '본명을 입력하십시오.' : '과거 하나를 고르십시오.'; }
});

app.addEventListener('change', e => { const t = e.target; if (t.matches && t.matches('[data-act=dmPick]') && t.value) dmOpen(t.value); });
app.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  if (kind === 'login') {
    const login = f.login.value.trim(), pw = f.pw.value;
    S.busy = true; S.err = ''; render();
    try { await (S.loginMode === 'up' ? B.signUp(login, pw) : B.signIn(login, pw)); }
    catch (err) { S.busy = false; S.err = errMsg(err); render(); const el = app.querySelector('[name=login]'); if (el) el.value = login; }
  }
  if (kind === 'opchat') {
    const r = myModalOp(), inp = f.text, text = inp.value.trim(); if (!r || !text) return;
    inp.value = '';
    if (S.tut && S.tut.r) { S.tut.r.chat.push({ uid: S.user.uid, name: (S.me && S.me.name) || '나', role: S.tut.role, text, ts: Date.now() }); return syncModal(); }
    try { await B.opCall('op:chat', { op: r.op.id, text }); } catch (err) { inp.value = text; inp.placeholder = errMsg(err); }
  }
  if (kind === 'dm') {
    const inp = f.text, text = inp.value.trim(); if (!text || !S.dmWith) return;
    inp.value = '';
    try { await B.dmSend(S.dmWith, text); } catch (err) { inp.value = text; inp.placeholder = errMsg(err); }
  }
  if (kind === 'gmAgent') {
    const n = k => +f.querySelector(`[name="${k}"]`).value, b = { uid: S.gmSel };
    b.stats = SN.map((_, i) => n('st' + i)); b.skills = Object.fromEntries(SKILLS.map(([k]) => [k, n('sk_' + k)]));
    b.res = { supply: n('supply'), research: n('research'), pass: n('pass') }; b.contamination = n('cont'); b.career = n('career'); b.statPts = n('pts');
    if (f.querySelector('[name=clearRegen]')?.checked) b.clearRegen = true; if (f.querySelector('[name=clearQuar]')?.checked) b.clearQuar = true;
    try { await B.gmAgent(b); S.gmMsg = '저장했습니다.'; } catch (err) { S.gmMsg = errMsg(err); } gmRender();
  }
  if (kind === 'gmNarr') {
    const r = gmCurOp(), inp = f.text, text = inp.value.trim(); if (!r || !text) return;
    try { await B.gmOp({ op: r.op.id, act: 'narrate', text }); inp.value = ''; } catch (err) { inp.placeholder = errMsg(err); }
  }
  if (kind === 'gmEvent' || kind === 'gmNotice') {
    const b = { text: f.text.value.trim(), kind: kind === 'gmNotice' ? 'notice' : 'gm' };
    if (f.voice) b.voice = f.voice.value.trim(); if (f.entity) b.entity = f.entity.value; if (f.level) b.level = f.level.value;
    if (!b.text) return;
    try { await B.gmEvent(b); S.gmMsg = kind === 'gmNotice' ? '공지를 띄웠습니다.' : '섹터 사건을 기록했습니다.'; f.reset(); } catch (err) { S.gmMsg = errMsg(err); } gmRender();
  }
  if (kind === 'chat') {
    const inp = f.text, text = inp.value.trim(); if (!text) return;
    inp.value = '';
    try { await B.sendChat({ uid: S.user.uid, num: S.me.num, name: S.me.name, role: S.me.role, channel: S.chan, text }); }
    catch (err) { inp.value = text; inp.placeholder = errMsg(err); }
  }
});

/* ═════════════ 12. 시작 ═════════════ */
render();
(async () => {
  B = DEMO ? demoBackend() : serverBackend();
  B.onAuth(onUser);
})();
</script>
